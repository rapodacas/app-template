name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  # Safety check: only deploy if UAT was completed
  verify-uat:
    runs-on: ubuntu-latest
    steps:
      - name: Verify UAT approval
        run: |
          echo "Production deploy triggered by merge to main."
          echo "UAT approval is enforced via branch protection rules."
          echo "If this runs, the PR was approved."

  deploy:
    runs-on: ubuntu-latest
    needs: verify-uat
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --production

      # --- CONFIGURE YOUR HOSTING PLATFORM HERE ---
      # Same options as deploy-staging.yml but pointing to production

      - name: Production deploy placeholder
        run: |
          echo "## Production Deployment" >> $GITHUB_STEP_SUMMARY
          echo "Configure your hosting platform in this workflow file." >> $GITHUB_STEP_SUMMARY
